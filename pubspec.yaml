name: med_mle_expert
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# ... version comments ...
version: 1.0.0+1

environment:
  # --- ADJUST SDK CONSTRAINT IF NEEDED based on your Flutter version ---
  # sdk: '>=3.0.0 <4.0.0' # Example for Flutter 3.10+
  sdk: '>=3.4.0 <4.0.0' # Example for Flutter 3.22+ (Choose appropriate)

# Dependencies specify other packages that your package needs in order to work.
dependencies:
  flutter:
    sdk: flutter
  # --- ADDED Firebase Core (Usually required) ---
  firebase_core: ^3.1.0 # Or latest version
  firebase_storage: ^12.0.1 # Or latest Firebase Storage
  # --- Your Existing Dependencies (Correctly Indented) ---
  firebase_auth: ^5.1.0 # Or latest version
  cloud_firestore: ^5.0.1 # Or latest version
  firebase_database: ^11.0.0 # Or latest version (Check compatibility)
  file_picker: ^8.0.5 # Or latest version
  # in_app_purchase: ^3.1.10 # Uncomment if needed
  provider: ^6.1.2
  intl: ^0.19.0 # Or latest version
  shared_preferences: ^2.2.3 # Or latest version
  # purchases_flutter: ^8.7.0 # Uncomment if needed
  flutter_pdfview: ^1.3.2
  http: ^1.2.2
  path_provider: ^2.1.4
  url_launcher: ^6.3.1
  permission_handler: ^11.3.1 # Or latest version
  device_info_plus: ^10.1.0 # Or latest version
  # dio: ^5.8.0+1 # Uncomment if needed
  # syncfusion_flutter_pdfviewer: ^29.1.37 # Uncomment if needed
  flutter_file_downloader: ^2.1.0
  # Add other dependencies here

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0 # Or latest linter version
  flutter_launcher_icons: ^0.13.1 # Keep this here

# --- flutter_launcher_icons configuration (Correctly Placed) ---
# This section should be at the root level, same as 'dependencies' and 'dev_dependencies'
flutter_launcher_icons:
  android: true # Generate Android icons
  ios: true # Generate iOS icons
  # --- IMPORTANT: Use PNG, not JPEG for icons ---
  image_path: "assets/icon/MedMle Expert.jpg" # Make sure this file exists and is a PNG
  min_sdk_android: 21 # Optional: If you need adaptive icons, set min SDK to 26+
  # Optional: Adaptive Icons for Android 8.0+ (Oreo)
  # adaptive_icon_background: "#FFFFFF" # Color for background layer (or path to image asset)
  # adaptive_icon_foreground: "assets/icon/app_icon_foreground.png" # Path to foreground layer image

# --- flutter section (remains the same) ---
flutter:
  uses-material-design: true
  # assets:
  #   - assets/icon/ # Make sure to declare your assets folder if using adaptive icons from assets
  #   - assets/icon/app_icon.png # Or declare the specific icon file
  # fonts:
  #   - family: ...